services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventdriven
      POSTGRES_USER: eventdriven
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventdriven -d eventdriven"]
      interval: 5s
      timeout: 5s
      retries: 12

  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server broker:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  coral:
    build: ./docker/coral
    init: true
    volumes:
      - coral_runtime:/run/coral
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/coral/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      JEV_MODE: ${JEV_MODE:-off}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_ENDPOINT: ${JEV_ENDPOINT:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-1.13.0}
      JEV_CONFIDENCE_THRESHOLD: ${JEV_CONFIDENCE_THRESHOLD:-0.85}
      JEV_TIMEOUT_MS: ${JEV_TIMEOUT_MS:-15000}
      APP_NODE_ID: ${APP_NODE_ID:-local-worker-1}
      WORKER_NODES: ${WORKER_NODES:-local-worker-1}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      APP_API_KEY: ${APP_API_KEY:-}
      AUTO_RETRY_MAX: ${AUTO_RETRY_MAX:-2}
      AUTO_RETRY_DELAY_MS: ${AUTO_RETRY_DELAY_MS:-60000}
      PROCESSING_LEASE_MS: ${PROCESSING_LEASE_MS:-1200000}
      DATABASE_URL: jdbc:postgresql://database:5432/eventdriven
      DATABASE_USER: eventdriven
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
      SPRING_AI_MODEL_CHAT: none
      CORAL_BASE_URL: http://coral:5555
      CORAL_RUNTIME_DIR: /run/coral
    volumes:
      - coral_runtime:/run/coral:ro
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      coral:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  ollama_data:
  coral_runtime:
